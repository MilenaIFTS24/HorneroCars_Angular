<div class="dashboard-layout">

  <nav class="sidebar">
    <div class="sidebar-sticky">
      <div class="sidebar-header">
        <h6 class="sidebar-title">Dashboard</h6>
        <span *ngIf="usuarioLogueado" class="sidebar-user-id">{{ usuarioLogueado.userId }}</span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item" *ngFor="let item of navItems">
          <a class="nav-link" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="{{ item.icon }} me-2"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
